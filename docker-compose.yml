services:

  api:
    build: .
    container_name: llm-observatory-api
    ports:
      - "8080:8080"
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434/api/chat
      - OLLAMA_HEALTH_URL=http://host.docker.internal:11434/api/tags
      - OLLAMA_TIMEOUT_SECONDS=60
      - MODEL=${MODEL:-qwen2.5:0.5b}
      - GIN_MODE=release
      - OTEL_SERVICE_NAME=llm-observatory-api
      - OTEL_EXPORTER_OTLP_ENDPOINT=tempo:4318
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - tempo
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: llm-observatory-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    container_name: llm-observatory-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboard.json:/var/lib/grafana/dashboards/llm-observatory.json:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=
    restart: unless-stopped

  loki:
    image: grafana/loki:3.1.0
    container_name: llm-observatory-loki
    ports:
      - "3100:3100"
    command:
      - "-config.file=/etc/loki/config.yml"
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.1.0
    container_name: llm-observatory-promtail
    command:
      - "-config.file=/etc/promtail/config.yml"
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      - loki
      - api
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.6.1
    container_name: llm-observatory-tempo
    ports:
      - "3200:3200"
      - "4318:4318"
    command:
      - "-config.file=/etc/tempo/config.yml"
    volumes:
      - ./tempo/config.yml:/etc/tempo/config.yml:ro
      - tempo-data:/tmp/tempo
    restart: unless-stopped

networks:
  default:
    name: llm-observatory

volumes:
  loki-data:
  tempo-data:
